<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love</title>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#ffdde1,#ee9ca7);
  font-family:Arial, sans-serif;
}

.heart {
  position: relative;
  width: 200px;
  height: 180px;
  transform: rotate(-45deg);
  background-color: red;
}

.heart::before,
.heart::after {
  content: "";
  position: absolute;
  width: 200px;
  height: 180px;
  background-color: red;
  border-radius: 50%;
}

.heart::before {
  top: -100px;
  left: 0;
}

.heart::after {
  left: 100px;
  top: 0;
}

.text {
  position: absolute;
  width: 200px;
  text-align: center;
  transform: rotate(45deg);
  color: white;
  font-weight: bold;
}

.text h1 {
  font-size: 18px;
  margin: 0;
}

.text p {
  font-size: 14px;
  margin: 5px 0 0;
}
</style>
</head>

<body>

<div class="heart">
  <div class="text">
    <h1>I LOVE YOU</h1>
    <p>botol yakult</p>
  </div>
</div>

</body>
</html>
