<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programmed Love - Corazón Real</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            perspective: 1000px;
            font-family: Arial, sans-serif;
        }

        /* --- HALAMAN KLIK AWAL --- */
        #welcome-page {
            position: absolute;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity 1s ease, visibility 1s;
        }

        #welcome-page.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .click-btn {
            background: none;
            border: 2px solid #ff4d6d;
            color: #ff4d6d;
            padding: 15px 30px;
            font-size: 1.5rem;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(255, 77, 109, 0.3);
        }

        .click-btn:hover {
            background-color: #ff4d6d;
            color: #000;
            box-shadow: 0 0 25px rgba(255, 77, 109, 0.8);
            transform: scale(1.05);
        }

        .heart-icon {
            font-size: 3rem;
            margin-top: 20px;
            animation: pulse 1.2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        /* --- KONTEN UTAMA (ANIMASI HATI) --- */
        #heart-container {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            transform-style: preserve-3d;
            opacity: 0;
            transition: opacity 1.5s ease-in;
        }

        #heart-container.show {
            opacity: 1;
        }

        .i_love_word {
            color: #ead6be;
            font-size: 1.2rem;
            font-family: Arial, sans-serif;
            position: absolute;
            text-shadow: 0 0 10px #ff53d9;
            white-space: nowrap;
            opacity: 0;
            /* Animasi diatur via JS agar jeda waktunya acak (smooth) */
            animation: heart-anim 4s infinite linear;
        }

        @keyframes heart-anim {
            0% {
                opacity: 0;
                transform: translate3d(var(--x), var(--y), 0) scale(0.8);
            }
            30% {
                opacity: 1;
                transform: translate3d(var(--x), var(--y), 0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate3d(var(--x), calc(var(--y) - 50px), 50px) scale(0.9);
            }
        }
    </style>
</head>
<body>

    <div id="welcome-page">
        <button class="click-btn" onclick="startLoveAnimation()">KLIK DI SINI</button>
        <div class="heart-icon">❤️</div>
    </div>

    <div id="heart-container"></div>

    <script>
        // Rumus matematika (Persamaan Jantung/Heart Curve) untuk posisi teks "I love you"
        function getHeartPosition(t) {
            // Nilai t berkisar dari 0 sampai 2 * PI
            // Menggunakan rumus standar kurva hati parametrik
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
            
            // Mengalikan dengan skala agar ukurannya pas di layar komputer
            return {
                x: x * 15, 
                y: y * 15
            };
        }

        function startLoveAnimation() {
            // Sembunyikan halaman klik
            document.getElementById('welcome-page').classList.add('hidden');
            
            // Tampilkan container hati
            const container = document.getElementById('heart-container');
            container.classList.add('show');

            // Jumlah total teks "I love you" yang membentuk hati
            const totalWords = 80; 

            for (let i = 0; i < totalWords; i++) {
                // Menghitung sudut t untuk setiap teks agar menyebar membentuk lingkaran hati
                const t = (i / totalWords) * 2 * Math.PI;
                const pos = getHeartPosition(t);

                // Membuat elemen teks baru
                const word = document.createElement('div');
                word.className = 'i_love_word';
                word.innerText = 'I love you';

                // Mengirim variabel posisi x dan y ke CSS
                word.style.setProperty('--x', `${pos.x}px`);
                word.style.setProperty('--y', `${pos.y}px`);

                // Memberikan delay acak agar munculnya bergantian secara halus (smooth)
                word.style.animationDelay = `${Math.random() * 4}s`;

                container.appendChild(word);
            }
        }
    </script>
</body>
</html>
